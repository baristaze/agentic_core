[project]
name = "acme-session-runner"
version = "0.1.0"
description = "The Acme session runner: claims the loops of agent sessions and runs them."
requires-python = ">=3.14"
dependencies = [
    "acme-om",
    "acme-infra",
    "acme-integrations",
    # The claim loop and the probe are the maintenance worker's, taken whole.
    "acme-maintenance",
    "pydantic-settings>=2.15",
]

[project.scripts]
acme-session-runner = "acme.workers.session_runner.entry:main"

[tool.uv.sources]
acme-om = { workspace = true }
acme-infra = { workspace = true }
acme-integrations = { workspace = true }
acme-maintenance = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
