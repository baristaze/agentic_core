[project]
name = "acme-checkers"
version = "0.1.0"
description = "The engine's static checker, agentic-check: the lenses of the agentic_core spec a parser decides."
requires-python = ">=3.14"
# Standard library only: it reads the source with `ast` and never imports it.
dependencies = []

[project.scripts]
agentic-check = "acme.agentic_check.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A subpackage of the shared root `acme`, with no acme/__init__.py (ADR 0001).
packages = ["src/acme"]
