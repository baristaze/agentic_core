# The engine's static checker, as its own distribution.
# Standard library only: nothing under [project] depends on anything.
# `version` is held equal to .claude-plugin/plugin.json by
# scripts/check_version.py; change it only in a release.

[project]
name = "agentic-core-check"
version = "0.1.0"
description = "Static checks for the lenses of the agentic_core spec."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
agentic-check = "agentic_check.cli:main"

# The build backend is pinned, so a build today and a build next year
# run the same backend.
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_check"]
