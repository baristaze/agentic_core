# Tool configuration for the checkers under scripts/ and their tests.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The release version
# lives in .claude-plugin/plugin.json, never here.

[project]
name = "agentic-core-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests"]
include = ["scripts/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "check_skills", "conftest"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests"]
mypy_path = ["scripts", "tests"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
