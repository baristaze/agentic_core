# Tool configuration for the checkers under scripts/, their tests, demo/,
# and performance/.
# This repository is not a Python package: nothing here is built or
# published, and uv does not manage it as a project. The engine's
# agentic-check is a member of the scaffold's workspace, which its own
# ruff.toml and pyrightconfig.json configure. The release version lives
# in .claude-plugin/plugin.json, never here.

[project]
name = "agentic-core-checks"
dynamic = ["version"]
requires-python = ">=3.10"

[tool.uv]
managed = false

[tool.ruff]
line-length = 130
src = ["scripts", "tests", "demo", "performance"]
include = ["scripts/**/*.py", "tests/**/*.py", "demo/**/*.py", "performance/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["_common", "check_skills", "conftest", "acme", "dreamcatcher", "replay"]

[tool.mypy]
python_version = "3.10"
files = ["scripts", "tests", "demo", "performance"]
mypy_path = ["scripts", "tests", "demo", "performance"]
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# The scaffold's agentic-check, which tests/test_agentic_check.py reads,
# is typed by the scaffold's pyright, on the Python a copy pins; the
# scripts keep the 3.10 floor above, so here it reads as Any.
[[tool.mypy.overrides]]
module = ["acme.*"]
ignore_missing_imports = true

# The performance run's own clients come with the scaffold's lock, which
# the type check does not install.
[[tool.mypy.overrides]]
module = ["aioboto3.*", "glide.*", "sqlalchemy.*"]
ignore_missing_imports = true

# The demo's recorder runs with Playwright, which `make demo-gif` brings;
# the type check runs without it.
[[tool.mypy.overrides]]
module = ["playwright.*"]
ignore_missing_imports = true
